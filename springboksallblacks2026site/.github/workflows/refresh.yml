# Refreshes data/reddit.json several times a day so the site shows the
# latest Baltimore-test threads. Runs entirely on GitHub's own token —
# no external access or secrets required. Can also be run on demand:
# repo → Actions tab → "Refresh event data" → Run workflow.
name: Refresh event data

on:
  schedule:
    # Four times a day (UTC). GitHub cron can drift by a few minutes.
    - cron: "23 2,8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest Reddit threads
        run: python3 scripts/fetch_reddit.py

      - name: Commit if changed
        run: |
          git config user.name "events-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/reddit.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh Reddit data"
            git push
          fi
